repos:
   - repo: https://github.com/astral-sh/ruff-pre-commit
     rev: v0.15.6
     hooks:
        - id: ruff-check  # Linter
          args: [--fix]  # Ensure fixes are applied
        - id: ruff-format  # Formatter

        # monitor code complexity
  # monitor code complexity
   - repo: https://github.com/rubik/xenon
     rev: v0.9.0
     hooks:
       - id: xenon
         exclude: ^lab[0-9]+/homework/
         args:
           - --max-absolute=B
           - --max-modules=B
           - --max-average=A
           - --exclude=lab1/homework/*,lab2/*
   - repo: local
     hooks:
       - id: mypy-homework
         name: mypy homework lab01
         entry: uv run --project lab1/homework mypy --config-file lab1/homework/pyproject.toml lab1/homework
         language: system
         types: [python]
         files: ^lab1/homework/.*\.py$
         pass_filenames: false