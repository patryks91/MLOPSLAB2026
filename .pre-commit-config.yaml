repos:
   - repo: https://github.com/astral-sh/ruff-pre-commit
     rev: v0.15.6
     hooks:
        - id: ruff-check  # Linter
          args: [--fix]  # Ensure fixes are applied
        - id: ruff-format  # Formatter

        # monitor code complexity
  # monitor code complexity
   - repo: https://github.com/rubik/xenon
     rev: v0.9.0
     hooks:
       - id: xenon
         exclude: ^homework/
         args:
           - --max-absolute=B
           - --max-modules=B
           - --max-average=A
           - --exclude=homework/*
   - repo: local
     hooks:
       - id: mypy-homework
         name: mypy homework lab01
         entry: uv run --project homework/lab01 mypy --config-file homework/lab01/pyproject.toml homework/lab01
         language: system
         types: [python]
         files: ^homework/lab01/.*\.py$
         pass_filenames: false